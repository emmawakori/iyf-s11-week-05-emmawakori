<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Remove Images Example</title>
</head>
<body>
  <h1>Image Removal Demo</h1>
  <img src="https://via.placeholder.com/150" alt="Sample 1">
  <img src="https://via.placeholder.com/200" alt="Sample 2">
  <br><br>
  <button onclick="removeImages()">Remove All Images</button>

  <h1>Image Toggle Demo</h1>
  <img src="https://via.placeholder.com/150" alt="Sample 1">
  <img src="https://via.placeholder.com/200" alt="Sample 2">
  <br><br>
  <button onclick="toggleImages()">Hide Images</button>

  <script src="imageRemover.js"></script>
</body>
</html>
